name: Build Flutter iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart environment
        run: |
          flutter doctor -v
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (Zero-Issues Gate)
        run: flutter analyze

      - name: Run automated unit & widget tests
        run: flutter test

      - name: Build iOS Application (Release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y VAVATranslator-Flutter-Release.ipa Payload
          ls -lh VAVATranslator-Flutter-Release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAVATranslator-Flutter-Release-IPA
          path: VAVATranslator-Flutter-Release.ipa
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VAVATranslator-Flutter-Release.ipa
          generate_release_notes: true
          draft: false
          prerelease: false

