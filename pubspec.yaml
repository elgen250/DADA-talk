name: vava_translator
description: "VAVA Translator - 100% On-Device Neural Translation & AI Coach"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_mlkit_translation: ^0.13.0
  google_mlkit_language_id: ^0.13.0
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  camera: ^0.12.1
  image_picker: ^1.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  home_widget: ^0.10.0
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
